# Đợt 482 (05/10/2026) — XUẤT BẢN THU GỌN lên GitHub Pages (thầy cho phép: "Bật cả thu gọn mã").
# Mỗi lần push main: dựng _site bằng tools/xuat-ban.mjs (esbuild minify TỪNG FILE .js/.css, mã nguồn repo giữ nguyên)
# rồi đưa lên Pages. Push dồn dập ⇒ chỉ bản mới nhất được xuất bản (cancel-in-progress).
# ⛔ Cần Settings › Pages › Build and deployment › Source = "GitHub Actions" (chủ repo bật 1 lần).
# KIỂM BẢN LIVE: python tools/kiem-live.py  (so build.json live với HEAD — đừng so băm .js/.css trực tiếp nữa).
name: Xuat ban AWord (thu gon)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock esbuild@0.28.2
      - run: node tools/xuat-ban.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
