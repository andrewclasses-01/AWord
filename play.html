<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWord in ANDREW CLASSES</title>

  <link rel="icon" href="core/assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="core/assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="core/assets/icons/favicon-192.png" />
  <link rel="apple-touch-icon" href="core/assets/icons/favicon-180.png" />

  <!-- ⭐ Đợt 285 — màn chờ + màu nền ngay từ HTML (giống index.html, xem chú
       thích bên đó). Đứng TRƯỚC app.css để chế độ nhúng `html.aw-nhung` (nền
       trong suốt) vẫn ghi đè được. play.js xoá màn chờ ngay khi vẽ "Loading...". -->
  <style>
    body { margin: 0; background: #eaf2fb; }
    html.aw-nhung, html.aw-nhung body { background: transparent; }
    .aw-boot {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px; color: #23303e;
      font-family: "Baloo 2", "Segoe UI", system-ui, Arial, sans-serif;
      opacity: 0; animation: aw-boot-in .3s ease .15s forwards;
    }
    html.aw-nhung .aw-boot { min-height: 0; padding: 40px 0; }
    .aw-boot-logo { font-size: 4.15rem; font-weight: 800; letter-spacing: -1.5px; color: #2f7bff; line-height: .9; }
    .aw-boot-logo span { color: #23303e; }
    .aw-boot-sub { font-size: .98rem; font-weight: 600; color: #9aa7b6; white-space: nowrap; }
    .aw-boot-sub b { color: #23303e; font-weight: 800; }
    .aw-boot-bar { width: 150px; height: 4px; border-radius: 4px; background: #d9e5f3; overflow: hidden; margin-top: 22px; }
    .aw-boot-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #2f7bff; animation: aw-boot-run 1.1s ease-in-out infinite; }
    @keyframes aw-boot-in { to { opacity: 1; } }
    @keyframes aw-boot-run { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>

  <!-- Shared UI (core) -->
  <link rel="stylesheet" href="core/app.css" />
  <link rel="stylesheet" href="core/themes/classic.css" />

  <!-- ⭐ Đợt 285 — bắt tay sớm với Google (SDK + Firestore; trang học sinh KHÔNG
       đăng nhập nên không cần identitytoolkit). -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" />

  <link rel="preload" href="core/assets/fonts/baloo-2-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="core/assets/fonts/baloo-2-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="core/assets/fonts/baloo-2-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="core/assets/fonts/baloo-2-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="core/assets/fonts/baloo-2-vi.woff2" as="font" type="font/woff2" crossorigin />

  <!-- ⭐⭐ Đợt 285 — TẢI MỘT ĐỢT (xem chú thích dài ở index.html). ⛔ KHÔNG SỬA
       TAY khối giữa hai mốc: `python tools/sinh-preload.py --write`. -->
  <!-- AW-PRELOAD:BEGIN -->
  <link rel="modulepreload" href="core/engine.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/utils.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/assignments.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/registry.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/unit.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/sfx.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/voice-clips.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/voice-playback.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/content-view.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/convert.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/scoring.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/mistakes.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/layout.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/press.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/icons.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/sound.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/wrong-sound.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/confetti.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/leaderboard.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/showdown.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/showdown-review.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/catalog.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/fit.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/themes/manifest.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/print.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/options-panel.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/options-migrate.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/timecost.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/flypenalty.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/firebase.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/tpl-files.js" fetchpriority="high" />
  <link rel="modulepreload" href="core/numberstepper.js" fetchpriority="high" />
  <!-- AW-PRELOAD:END -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js" fetchpriority="high" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js" fetchpriority="high" />
  <!-- ⭐⭐ Đợt 285c — KÉO SONG SONG THẬT SỰ BẰNG fetch(). Đo trên Chrome thật của thầy:
       mọi yêu cầu do <link>/<script> phát ra (kể cả modulepreload + fetchpriority=high)
       chỉ được ra mạng 3 CÁI MỘT LÚC, mỗi lượt hỏi-lại server ~300ms ⇒ 39 file ≈ 4-5
       giây; còn fetch() thì 20 cái cùng lúc. Nên ngay sau khi khai báo danh sách, gọi
       fetch() cho TỪNG file: chúng về song song, nằm sẵn trong cache HTTP, và lượt tải
       thật của trình duyệt (vẫn 3 cái một) chỉ còn đọc cache (1-3ms mỗi file). Tự đọc
       lại danh sách modulepreload ở trên nên KHÔNG có danh sách thứ hai phải bảo trì.
       Hỏng fetch() (mạng, trình duyệt cũ) thì trang vẫn tải kiểu thường — chỉ chậm hơn. -->
  <script>
    (function () {
      try {
        var ls = document.querySelectorAll('link[rel="modulepreload"]');
        for (var i = 0; i < ls.length; i++) fetch(ls[i].href).catch(function () {});
      } catch (e) { /* trình duyệt không có fetch: bỏ qua */ }
    })();
  </script>

  <!-- No template stylesheet here: play.js loads ONLY the one game this student
       was assigned, css included — see ensureTemplate() in core/registry.js. -->
</head>
<body>
  <!-- The student page renders here. NO sign-in, NO library — see play.js -->
  <div id="app">
    <div class="aw-boot" aria-hidden="true">
      <div class="aw-boot-logo">A<span>Word</span></div>
      <div class="aw-boot-sub">in <b>ANDREW CLASSES</b></div>
      <div class="aw-boot-bar"><i></i></div>
    </div>
  </div>

  <!-- ⭐ Đợt 285 — mở kết nối Firestore SONG SONG với việc tải mã (SDK + khởi
       tạo app). ⭐ Đợt 286 — và ĐỌC LUÔN bài giao `?g=` ngay từ đây
       (`warmUpAssignment`, core/assignments.js): lượt đọc ~300ms chạy song song
       với việc tải 31 module; play.js gọi getAssignment() sau đó nhận đúng
       promise này, không đọc Firestore 2 lần. -->
  <script type="module">
    import("./core/firebase.js").then(m => m.db()).catch(() => {});
    const g = new URLSearchParams(location.search).get("g");
    if (g) import("./core/assignments.js").then(m => m.warmUpAssignment(g)).catch(() => {});
  </script>
  <script type="module" src="play.js"></script>
</body>
</html>
