html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#host { position: fixed; inset: 0; }
.lab-note { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #e2e8f0; background: #05070b; font: 700 20px "Exo 2", system-ui, sans-serif; text-align: center; padding: 24px; }
.lab-note[hidden] { display: none; }

<body>
<div id="host"></div>
<div class="lab-note" id="note">Loading…</div>
<script type="module">
import { currentUser, signIn } from "../core/firebase.js";
import { labSignal, labPadUrl } from "../templates/racing-words/rw-lab-signal.js";
import { activity } from "../templates/racing-words/sample-racing-words.js";
const note = document.getElementById("note");
async function go() {
  if (!(await currentUser())) {
    note.innerHTML = 'Sign in to AWord first (same Google account as the iPads).<button type="button">Sign in</button>';
    note.querySelector("button").onclick = async () => { try { await signIn(); location.reload(); } catch (e) { alert(e.message || e); } };
    return;
  }
  note.textContent = "Loading the race…";
  const [{ createRacingWords }, { createPadHost }] = await Promise.all([import("../templates/racing-words/3d/rw-5j.js"), import("../templates/racing-words/3d/sr3d-padlink-5j.js")]);
  const remote = createPadHost({ signal: labSignal(), padUrl: labPadUrl });
  const opts = { pkBoost: true, pkLife: true, pkMissile: true, twists: true, race: "len", lenK: 2, steps: 12, laps: 0, ramps: true, sameQ: true, msMax: 3, lives: 5, msDmg: 2, tieWait: 0.1, missWait: 20, streak: 3 };
  const rw = await createRacingWords({ mount: document.getElementById("host"), questions: activity.content.questions, title: "RACING WORDS", options: opts, host: null, remote, onEvent: () => {} });
  note.hidden = true;
  window.__rw = () => rw; window.__remote = remote;
  addEventListener("pagehide", () => { try { rw.destroy(); } catch (e) { /* */ } try { remote.close(); } catch (e) { /* */ } });
}
go().catch(e => { console.error(e); note.textContent = "Could not start: " + (e.message || e); });
</script>
