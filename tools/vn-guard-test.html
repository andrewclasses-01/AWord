<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VNTEST</title>
<link rel="stylesheet" href="../core/app.css" />
<link rel="stylesheet" href="../core/themes/classic.css" />
<style>#bar{position:fixed;top:0;right:0;z-index:99999;background:#111;color:#fff;font:14px monospace;padding:4px}</style>
</head><body>
<div id="bar"></div>
<script>/* mulberry32 — cố định ngẫu nhiên để 2 lần chạy xếp ô giống hệt */
(() => { let a = 42; Math.random = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();</script>
<div id="app"></div>
<script type="module">
// Bàn thử Đợt 419 (core/vn-guard.js): ?t=tta|cw|ftg|rw — mở template THẬT bằng bộ bài mẫu, không đăng nhập,
// không ghi gì. Máy phát lại UniKey: `python tools/unikey-replay.py tta "book was"` (cần devserver.py 5619).
import { ensureTemplate } from "../core/registry.js";
import { startGame } from "../core/engine.js";
const t = new URLSearchParams(location.search).get("t") || "tta";
const map = {
  tta: ["type_the_answer", "../templates/type-the-answer/sample-type-the-answer.js"],
  cw:  ["crossword", "../templates/crossword/sample-crossword.js"],
  ftg: ["find_the_gap", "../templates/find-the-gap/sample-find-the-gap.js"],
  rw:  ["running_word", "../templates/running-word/sample-running-word.js"],
};
const [type, path] = map[t];
const { activity } = await import(path);
const act = structuredClone(activity);
if (t === "ftg") act.options = { ...act.options, mode: "type" };
if (t === "rw") { const m = await import("../templates/running-word/rw-sets.js"); act.content = { ...act.content, printSets: [m.buildSets(m.poolFrom(act))] }; }
act.options = { ...act.options, shuffleQuestions: false, shuffle: false, timer: "none" };
await ensureTemplate(type);
startGame(document.getElementById("app"), act, { noLastTpl: true, noAutoFight: true, onExit(){} });
window.__ready = true;
// tự bấm màn Ready / START MATCH / chọn ô, rồi đặt con trỏ vào ô gõ
setInterval(() => {
  const r = document.querySelector(".aw-play-overlay .aw-bigplay"); if (r && r.offsetParent) { r.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, isPrimary: true })); r.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, button: 0, isPrimary: true })); r.click(); }
  if (t === "rw") { const b = [...document.querySelectorAll("button")].find(x => /START MATCH/i.test(x.textContent) && x.offsetParent); if (b) { b.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, isPrimary: true })); b.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, button: 0, isPrimary: true })); b.click(); } }
  if (t === "rw" && !window.rwPicked) { const bd = document.querySelector(".aw-rw-board.is-a"); if (bd && bd.offsetParent) { window.rwPicked = true; bd.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, isPrimary: true })); bd.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, button: 0, isPrimary: true })); bd.click(); } }
  if (t === "cw" && !window.cwPicked) { const cell = document.querySelector(".aw-cw-cell:not(.is-blank)"); if (cell && cell.offsetParent) { window.cwPicked = true; cell.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, isPrimary: true })); cell.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, button: 0, isPrimary: true })); } }
  const inp = document.querySelector(".aw-tta-input, .aw-rw-input");
  if (inp && document.activeElement !== inp && !inp.disabled) inp.focus();
}, 150);
document.getElementById("bar").textContent = "VNTEST " + t;
</script></body></html>
